<!doctype html>
<html class="no-js" lang="sv">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Quicksand">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/foundation.css">
  <title>Foundation Starter Template</title>
</head>

<body>
  <header>
    <nav>
      <div class="grid-container full">

        <div class="grid-x grid-margin-x grid-padding-x small-up-2 medium-up-4">
          <div class="cell large-auto"><a href="index.html">Startsida</a></div>
          <div class="cell large-auto"><a href="milligram.html">Milligram</a></div>
          <div class="cell large-auto"><a href="tailwind.html">Tailwind</a></div>
          <div class="cell large-auto"><a href="publicering.html">Publicering</a></div>
        </div>
      </div>

    </nav>
  </header>
  <main>
    <article id="foundationArticle">
      <div id="heading-wrapper">
        <h1>Foundation</h1>
        <h2>"The most advanced responsive front-end framework in the world"</h2>
        <img src="public/foundation.svg">
        <a class="hollow button small" href="https://get.foundation/index.html">Foundations webbplats</a>
      </div>
      <section id="foundationText">

        <p class="foundationP">

        </p>



      </section>
      
      <section id="formWrapper">
        <h3>Tabell och formulär</h3>
        <form>
          <div class="grid-container">
            <div class="grid x grid-padding-x">
              <div class="medium-6 cell">
                <label>Country
                  <input type="text" placeholder="Germany">
                </label>
              </div>
              <fieldset class="fieldset">
                <legend>Do you recommend travelling here?</legend>
                <input id="recommend" type="checkbox"><label for="recommend">Yes</label>
                <input id="notrecommend" type="checkbox"><label for="notrecommend">No</label>
              </fieldset>
              <label>
                Comments
                <textarea placeholder="Great food and perfect hiking trails!"></textarea>
              </label>
              <label>Select rating</label>
              <select>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </div>
          </div>
        </form>
      </section>
    </article>

  </main>
</body>

</html>
